<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 128 128" role="img" aria-label="MnemoDuck — Ошибка">
<title>MnemoDuck — Ошибка</title>

<defs>
  <linearGradient id="sun" x1="0" y1="0" x2="0.84" y2="1"><stop offset="0" stop-color="#F53C65"/><stop offset=".48" stop-color="#EE204D"/><stop offset="1" stop-color="#D91C45"/></linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF7EE"/></linearGradient>
  <linearGradient id="bill" x1="0" y1="0" x2=".65" y2="1"><stop offset="0" stop-color="#FFC000"/><stop offset=".65" stop-color="#FFAB00"/><stop offset="1" stop-color="#FF9100"/></linearGradient>
