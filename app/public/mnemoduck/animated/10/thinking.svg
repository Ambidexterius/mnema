<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 100 100" role="img" aria-label="MnemoDuck — Думает">
<title>MnemoDuck — Думает</title>

<defs>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F53C65"/><stop offset=".6" stop-color="#EE204D"/><stop offset="1" stop-color="#D91C45"/></linearGradient>
  <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC218"/><stop offset="1" stop-color="#FF9700"/></linearGradient>
</defs>
<style>
@media (prefers-reduced-motion: reduce) { *, *::before, *::after {animation: none !important;} }
.body{transform-origin: 63px 74px;transform-box:view-box;}
.eye{transform-box:fill-box;transform-origin:center;}
.beak{transform-box:fill-box;transform-origin:center;}
.dec{transform-box:fill-box;transform-origin:center;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.7px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes blink{0%,43%,48%,96%,100%{transform:scaleY(1)}45%,46%{transform:scaleY(.10)}}
@keyframes listening{0%,100%{transform:translateX(-1px)}40%,70%{transform:translateX(2px)}}
@keyframes nod{0%,100%{transform:rotate(0)}38%{transform:rotate(-3deg)}70%{transform:rotate(2deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes happy{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-2px) scale(1.02)}50%{transform:translateY(0) scale(1)}70%{transform:translateY(-1px)}}
@keyframes wink{0%,58%,73%,100%{transform:scaleY(1)}64%{transform:scaleY(.13)}}
@keyframes love{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes pulse{0%,100%{transform:scale(.83);opacity:.25}50%{transform:scale(1);opacity:1}}
@keyframes dots{0%,70%,100%{opacity:.18;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes pop{0%,15%,100%{transform:scale(1)}45%{transform:scale(1.17)}}
@keyframes appear{0%,30%{transform:scale(0)}55%,100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}17%,51%{transform:translateX(-2px)}34%,68%{transform:translateX(2px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes burst{0%,20%,100%{opacity:1;transform:scale(1)}47%{opacity:.5;transform:scale(1.1)}}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.70}}
 .body{animation:nod 2.2s ease-in-out infinite;} .body{transform-origin:50px 50px;}  .d1{animation:dots 1.25s ease-in-out infinite;} .d2{animation:dots 1.25s .2s ease-in-out infinite;} .d3{animation:dots 1.25s .4s ease-in-out infinite;} </style>
<g class="body">
<path d="M 23 3 H 60 C 80 3 95 18 95 39 V 65 C 95 84 83 96 63 96 H 31 C 13 96 3 86 3 68 V 24 C 3 12 11 3 23 3 Z" fill="url(#sun)"/>
<path d="M 3 72 C 21 56 25 30 49 25 C 56 23 61 22 67 25 C 74 17 81 17 82 22 L 80 28 C 88 29 90 33 86 37 C 91 44 90 57 86 65 C 81 77 54 86 12 92 C 5 88 3 82 3 72 Z" fill="#FFFCF6"/>
<ellipse class="eye" cx="64" cy="54" rx="4.6" ry="9" fill="#18131A"/><ellipse class="eye" cx="80" cy="51" rx="4.6" ry="9" fill="#18131A"/><path d="M74 38 L84 35" stroke="#342A22" stroke-width="3.5" stroke-linecap="round"/><path class="beak" d="M69 67 Q82 65 94 63 Q87 77 74 76 Q70 74 69 67Z" fill="url(#bill)"/><path d="M72 74 Q81 80 90 72 Q82 83 75 78Z" fill="#ED7B00"/></g>
</svg>